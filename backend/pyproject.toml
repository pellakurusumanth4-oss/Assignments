[project]
name = "refund-agent"
version = "0.1.0"
description = "LLM refund approve/deny/escalate agent (LangChain create_agent + policy guardrail middleware) with a FastAPI server."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-cli[inmem]>=0.2",   # `langgraph dev` — run the graph in LangGraph Studio
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refund_agent", "server"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
